name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize site navigation
        run: node normalize-site.mjs
      - name: Inject structured data
        run: node prepare-seo.mjs
      - name: Generate sitemap
        run: node generate-sitemap.mjs
      - name: Audit entire site
        run: node audit-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow artifact metadata to settle
        run: sleep 10
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

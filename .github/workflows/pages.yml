name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize site navigation
        run: node normalize-site.mjs
      - name: Inject structured data
        run: node prepare-seo.mjs
      - name: Generate sitemap
        run: node generate-sitemap.mjs
      - name: Audit entire site
        run: node audit-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow artifact metadata to settle
        run: sleep 10
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const xml = fs.readFileSync('sitemap.xml','utf8');
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1].replaceAll('&amp;','&'));
          const key = '7b2cf8d3de2bd503111a01bf0c6628e6';
          const body = JSON.stringify({
            host: 'oosaka0123-sudo.github.io',
            key,
            keyLocation: 'https://oosaka0123-sudo.github.io/mikkyou-guide/' + key + '.txt',
            urlList: urls
          });
          const req = https.request('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: {'Content-Type':'application/json; charset=utf-8','Content-Length':Buffer.byteLength(body)}
          }, res => {
            console.log('IndexNow status:', res.statusCode, 'URLs:', urls.length);
            if (res.statusCode < 200 || res.statusCode >= 300) process.exitCode = 1;
            res.resume();
          });
          req.on('error', e => { console.error(e); process.exitCode = 1; });
          req.write(body); req.end();
          NODE
